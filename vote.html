<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线投票系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
        body{min-height:100vh;background:#0a192f;color:#fff;overflow-x:hidden}
        #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        h1{text-align:center;margin-bottom:40px;color:#64ffda}
        .vote-item{background:rgba(255,255,255,0.1);border-radius:12px;padding:20px;margin:15px 0;backdrop-filter:blur(10px)}
        .vote-name{font-size:18px;margin-bottom:10px}
        .vote-bar{height:10px;background:rgba(255,255,255,0.2);border-radius:5px;overflow:hidden;margin:10px 0}
        .vote-progress{height:100%;background:#64ffda;transition:all 0.5s}
        .btn{padding:8px 20px;border:none;border-radius:6px;background:#64ffda;color:#000;cursor:pointer;margin-top:8px}
        .admin-btn{display:block;text-align:center;margin:30px auto;color:#64ffda}
    </style>
</head>
<body>
<div id="particles"></div>
<div class="container">
    <h1>人气投票</h1>
    <div id="voteList"></div>
    <a href="admin.html" class="admin-btn">进入后台管理</a>
</div>

<script>
// 粒子背景
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('particles').appendChild(canvas);
let w=canvas.width=innerWidth,h=canvas.height=innerHeight;
window.onresize=()=>w=canvas.width=innerWidth,h=canvas.height=innerHeight;
let particles=[];
class Particle{
    constructor(){
        this.x=Math.random()*w;
        this.y=Math.random()*h;
        this.r=Math.random()*2+1;
        this.sx=Math.random()*1-0.5;
        this.sy=Math.random()*1-0.5;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle='rgba(100,255,218,0.6)';
        ctx.fill();
    }
    update(){
        this.x+=this.sx;this.y+=this.sy;
        if(this.x<0||this.x>w)this.sx*=-1;
        if(this.y<0||this.y>h)this.sy*=-1;
        this.draw();
    }
}
for(let i=0;i<80;i++)particles.push(new Particle());
function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>p.update());
    requestAnimationFrame(animate);
}
animate();

// 投票数据
let voteData = JSON.parse(localStorage.getItem('voteData')) || [
    {name:"选项A",count:0},
    {name:"选项B",count:0},
    {name:"选项C",count:0}
];
function renderVote(){
    let html='';
    let total=voteData.reduce((a,b)=>a+b.count,0);
    voteData.forEach((item,idx)=>{
        let per=total==0?0:(item.count/total*100).toFixed(1);
        html+=`
        <div class="vote-item">
            <div class="vote-name">${item.name}</div>
            <div class="vote-bar"><div class="vote-progress" style="width:${per}%"></div></div>
            <span>票数：${item.count} 占比${per}%</span>
            <button class="btn" onclick="vote(${idx})">投票</button>
        </div>
        `
    })
    document.getElementById('voteList').innerHTML=html;
}
function vote(idx){
    voteData[idx].count++;
    localStorage.setItem('voteData',JSON.stringify(voteData));
    renderVote();
    alert("投票成功！");
}
renderVote();
</script>
</body>
</html>
