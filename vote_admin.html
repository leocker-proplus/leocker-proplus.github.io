<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票后台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
        body{min-height:100vh;background:#0a192f;color:#fff}
        #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        h1{text-align:center;margin-bottom:40px;color:#64ffda}
        .box{background:rgba(255,255,255,0.1);border-radius:12px;padding:25px;margin:15px 0;backdrop-filter:blur(10px)}
        input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;outline:none}
        button{padding:10px 20px;border:none;border-radius:6px;background:#64ffda;color:#000;cursor:pointer;margin:5px}
        .back{text-align:center;margin-top:30px}
        .back a{color:#64ffda}
    </style>
</head>
<body>
<div id="particles"></div>
<div class="container">
    <h1>投票管理后台</h1>
    <div class="box">
        <h3>新增选项</h3>
        <input type="text" id="name" placeholder="输入名称">
        <button onclick="add()">添加</button>
    </div>
    <div class="box">
        <button onclick="reset()">清空票数</button>
    </div>
    <div class="box"><div id="list"></div></div>
    <div class="back"><a href="vote.html">返回投票页</a></div>
</div>

<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('particles').appendChild(canvas);
let w=canvas.width=innerWidth,h=canvas.height=innerHeight;
window.onresize=()=>w=canvas.width=innerWidth,h=canvas.height=innerHeight;
let particles=[];
class Particle{
    constructor(){
        this.x=Math.random()*w;this.y=Math.random()*h;
        this.r=Math.random()*2+1;
        this.sx=Math.random()*1-0.5;this.sy=Math.random()*1-0.5;
    }
    draw(){
        ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle='rgba(100,255,218,0.6)';ctx.fill();
    }
    update(){
        this.x+=this.sx;this.y+=this.sy;
        if(this.x<0||this.x>w)this.sx*=-1;
        if(this.y<0||this.y>h)this.sy*=-1;
        this.draw();
    }
}
for(let i=0;i<80;i++)particles.push(new Particle());
function animate(){ctx.clearRect(0,0,w,h);particles.forEach(p=>p.update());requestAnimationFrame(animate);}
animate();

const OWNER = "你的用户名";
const REPO = "仓库名";
let data = [];

async function load(){
    let res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues?labels=vote`);
    let arr = await res.json();
    data = arr.length?JSON.parse(arr[0].body):[];
    show();
}
function show(){
    let html="";
    data.forEach((item,i)=>{
        html+=`<p>${item.name} 票数：${item.count} <button onclick="del(${i})">删除</button></p>`;
    });
    document.getElementById("list").innerHTML=html;
}
async function save(){
    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({title:"投票数据",body:JSON.stringify(data),labels:["vote"]})
    });
    load();
}
function add(){
    let n = document.getElementById("name").value.trim();
    if(!n)return;
    data.push({name:n,count:0});
    save();
}
function del(i){
    data.splice(i,1);save();
}
function reset(){
    data.forEach(v=>v.count=0);save();
}
load();
</script>
</body>
</html>
