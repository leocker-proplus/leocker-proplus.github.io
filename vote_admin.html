<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票后台管理</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
        body{min-height:100vh;background:#0a192f;color:#fff}
        #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        h1{text-align:center;margin-bottom:40px;color:#64ffda}
        .box{background:rgba(255,255,255,0.1);border-radius:12px;padding:25px;margin:15px 0;backdrop-filter:blur(10px)}
        input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;outline:none}
        button{padding:10px 20px;border:none;border-radius:6px;background:#64ffda;color:#000;cursor:pointer;margin:5px}
        .back{text-align:center;margin-top:30px}
        .back a{color:#64ffda}
    </style>
</head>
<body>
<div id="particles"></div>
<div class="container">
    <h1>投票后台管理中心</h1>
    <div class="box">
        <h3>新增投票选项</h3>
        <input type="text" id="optName" placeholder="输入选项名称">
        <button onclick="addOption()">添加</button>
    </div>
    <div class="box">
        <h3>数据管理</h3>
        <button onclick="resetAll()">清空所有票数</button>
        <button onclick="exportData()">导出数据</button>
    </div>
    <div class="box">
        <h3>当前投票列表</h3>
        <div id="adminList"></div>
    </div>
    <div class="back"><a href="index.html">返回投票首页</a></div>
</div>

<script>
// 粒子背景 共用样式
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('particles').appendChild(canvas);
let w=canvas.width=innerWidth,h=canvas.height=innerHeight;
window.onresize=()=>w=canvas.width=innerWidth,h=canvas.height=innerHeight;
let particles=[];
class Particle{
    constructor(){
        this.x=Math.random()*w;
        this.y=Math.random()*h;
        this.r=Math.random()*2+1;
        this.sx=Math.random()*1-0.5;
        this.sy=Math.random()*1-0.5;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle='rgba(100,255,218,0.6)';
        ctx.fill();
    }
    update(){
        this.x+=this.sx;this.y+=this.sy;
        if(this.x<0||this.x>w)this.sx*=-1;
        if(this.y<0||this.y>h)this.sy*=-1;
        this.draw();
    }
}
for(let i=0;i<80;i++)particles.push(new Particle());
function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p=>p.update());
    requestAnimationFrame(animate);
}
animate();

// 后台逻辑
function getDate(){
    return JSON.parse(localStorage.getItem('voteData')) || [];
}
function saveData(data){
    localStorage.setItem('voteData',JSON.stringify(data));
    renderAdmin();
}
function renderAdmin(){
    let data=getDate();
    let html='';
    data.forEach((item,idx)=>{
        html+=`<p>${item.name} — 票数：${item.count} 
        <button onclick="delOpt(${idx})">删除</button></p>`
    })
    document.getElementById('adminList').innerHTML=html;
}
function addOption(){
    let name=document.getElementById('optName').value.trim();
    if(!name)return alert("请输入名称");
    let data=getDate();
    data.push({name:name,count:0});
    saveData(data);
    document.getElementById('optName').value='';
    alert("添加成功");
}
function delOpt(idx){
    let data=getDate();
    data.splice(idx,1);
    saveData(data);
}
function resetAll(){
    if(!confirm("确定清空全部票数？"))return;
    let data=getDate();
    data.forEach(item=>item.count=0);
    saveData(data);
    alert("已重置");
}
function exportData(){
    let data=getDate();
    let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='投票数据.json';
    a.click();
}
renderAdmin();
</script>
</body>
</html>
